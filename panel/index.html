<!doctype html>
<html lang="es" data-raiz=".." data-herramienta>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#050D18">
<title>Panel · Gimnasios Xtreme</title>

<link rel="icon" href="../assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="../assets/img/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="../assets/img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Xtreme">

<link rel="preload" as="font" type="font/woff2" href="../assets/fonts/archivo-latin.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="../assets/fonts/inter-latin.woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/fuentes.css?v=20260924d">
<link rel="stylesheet" href="../assets/css/estilos.css?v=20260924d">
<link rel="stylesheet" href="panel.css">

<!-- Dirección de la web pública para «Ver la web». tools/publicar.js la cambia
     por la de verdad al preparar el panel para Vercel. -->
<script>window.__PANEL__ = { web: "../index.html" };</script>
<script src="../lib/manifest.js?v=20260924d"></script>
<script src="../lib/plantillas.js?v=20260924d"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.min.js"></script>
<script src="../lib/config.js?v=20260924d"></script>
<script src="gestion.js"></script>
</head>
<body>

<!-- El panel es una herramienta interna: no lleva la cabecera ni el pie del
     sitio público. Su propia barra tiene el botón «Ver la web». -->
<main id="principal">
  <div data-panel></div>
</main>

<!-- La web, vista desde dentro del panel: así nunca se sale de él -->
<div class="p-visor" data-visor hidden role="dialog" aria-modal="true" aria-label="La web">
  <div class="p-visor-barra">
    <button type="button" class="boton boton--fantasma boton--pequeno" data-cerrar-visor>← Volver al panel</button>
    <span class="p-visor-titulo">Así ve la web la gente</span>
    <a class="boton boton--fantasma boton--pequeno" data-visor-fuera href="#" target="_blank" rel="noopener">Abrir fuera</a>
  </div>
  <iframe title="La web de Gimnasios Xtreme" data-visor-marco></iframe>
</div>

<div class="p-tostadas" data-tostadas aria-live="polite"></div>

<script src="../assets/js/nucleo.js?v=20260924d"></script>
<script src="../assets/js/componentes.js?v=20260924d"></script>
<script src="panel.js"></script>
</body>
</html>
